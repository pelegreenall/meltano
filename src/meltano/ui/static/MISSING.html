<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meltano UI</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #18181b;
        --muted: #52525b;
        --border: #e4e4e7;
        --code-bg: #f4f4f5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #18181b;
          --fg: #fafafa;
          --muted: #a1a1aa;
          --border: #3f3f46;
          --code-bg: #27272a;
        }
      }
      body {
        margin: 0;
        padding: 48px 16px;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.6 ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
      }
      main {
        max-width: 42rem;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: var(--muted);
      }
      code {
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2px 6px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.9em;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>The Meltano UI frontend has not been built</h1>
      <p>
        This is expected in a source checkout. The API is running and fully
        functional under <code>/api/v1</code>, and the interactive docs at
        <a href="/docs">/docs</a> are enough to develop against.
      </p>
      <p>To build the browser application, run <code>nox -s ui_build</code>.</p>
    </main>
  </body>
</html>
